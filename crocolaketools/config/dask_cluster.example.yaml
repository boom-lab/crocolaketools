# TEMPLATE -- see datasets.example.yaml for how to use it.
#
# This config file contains the fields for the config_hpc dictionary used by the
# scripts in the script folder.
# Field names must be arguments to dask's LocalCluster Client
#  (https://docs.dask.org/en/stable/deploying-python.html)


# Argo
ARGO-GDAC_PHY:
    threads_per_worker: 1
    n_workers: 18
    memory_limit: '5.5GB'
    processes: True

ARGO-GDAC_BGC:
    threads_per_worker: 1
    n_workers: 9
    memory_limit: '11GB'
    processes: True

ARGO-QC_PHY:
    threads_per_worker: 1
    n_workers: 4
    memory_limit: '2GB'
    processes: True

ARGO-QC_BGC:
    threads_per_worker: 9
    n_workers: 4
    memory_limit: '36GiB' # memory limit per worker
    processes: True

SPRAY_GLIDERS:
    threads_per_worker: 4
    n_workers: 1
    memory_limit: '12GB'
    processes: True

GLODAP:
    threads_per_worker: 20
    n_workers: 1
    memory_limit: '12GB'
    processes: True

# Saildrones configuration
SAILDRONES:
    threads_per_worker: 8
    n_workers: 2
    memory_limit: '32GB'
    processes: True

# OleanderXBT configuration
OLEANDER_XBT:
    threads_per_worker: 1
    n_workers: 8
    memory_limit: '32GB'
    processes: True

SPOTS:
    threads_per_worker: 2
    n_workers: 1
    memory_limit: '4GB'
    processes: True

# CrocoLake merge (merge_crocolake --config); size for the full PHY/BGC
# CrocoLake. Without these keys the merge falls back to SPRAY_GLIDERS.
CROCOLAKE_PHY:
    threads_per_worker: 4
    n_workers: 1
    memory_limit: '12GB'
    processes: True

CROCOLAKE_BGC:
    threads_per_worker: 4
    n_workers: 1
    memory_limit: '12GB'
    processes: True
