          pip install -e .

      - name: Run data integrity tests
        shell: bash -l {0}
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_data.py

  tests-conda-golden:
    name: golden tests (conda, from environment.yml)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
