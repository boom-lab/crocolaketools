# Note: including tests that are successful, ratcheting towards a full
#       test-suite; existing tests outside of GLODAP, IOOSGliders, OleanderXBT,
#       SprayGliders are not included at this time


name: CI

on:
  push:
  pull_request:
    branches:
      - develop

jobs:
  tests-pip-downloader:
    name: downloader tests (pip, py=${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run downloader tests
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_downloader{GLODAP,IOOSGliders,OleanderXBT,SprayGliders,Saildrones}.py

  tests-pip-converter:
    name: converter tests (pip, py=${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run downloader tests
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_converter.py::TestConverter::test_converter_{add_derived_variables,abs_sal_computed,conservative_temp_computed,sigma1_computed,glodap_v3_read_and_standardize,glodap_v3_qc_filtering,saildrones_sensor_merging,saildrones_assign_depths,wrap_longitude}

  tests-pip-golden:
    name: golden tests (pip, py=${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run golden tests
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_golden.py

  tests-conda-downloader:
    name: downloader tests (conda, from environment.yml)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install package + test extras (inside conda env)
        shell: bash -l {0}
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run downloader tests
        shell: bash -l {0}
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_downloader{GLODAP,IOOSGliders,OleanderXBT,SprayGliders,Saildrones}.py

  tests-conda-converter:
    name: converter tests (conda, from environment.yml)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install package + test extras (inside conda env)
        shell: bash -l {0}
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run golden tests
        shell: bash -l {0}
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_converter.py::TestConverter::test_converter_{add_derived_variables,abs_sal_computed,conservative_temp_computed,sigma1_computed,glodap_v3_read_and_standardize,glodap_v3_qc_filtering,saildrones_sensor_merging,saildrones_assign_depths,wrap_longitude}

  tests-conda-golden:
    name: golden tests (conda, from environment.yml)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install package + test extras (inside conda env)
        shell: bash -l {0}
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run golden tests
        shell: bash -l {0}
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_golden.py
