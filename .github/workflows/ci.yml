# Note: including tests that are successful, ratcheting towards a full
#       test-suite. Known coverage gaps: downloaderArgoGDAC.py, converterSPOTS.py

name: CI

on:
  push:
    # branches only: a tag push is release.yml's job
    branches:
      - '**'
  pull_request:
    branches:
      - develop

jobs:
  tests-pip-downloader:
    name: downloader tests (pip, py=${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run downloader and config-path tests
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_downloader{ArgoTools,GLODAP,IOOSGliders,OleanderXBT,SprayGliders,Saildrones}.py tests/test_config_paths.py

  tests-pip-converter:
    name: converter tests (pip, py=${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
