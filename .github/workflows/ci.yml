  tests-pip-golden:
    name: golden tests (pip, py=${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run golden tests
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_golden.py

  tests-conda-downloader:
    name: downloader tests (conda, from environment.yml)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # environment.yml pip-installs ./crocolakeloader/
          submodules: true

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Install package + test extras (inside conda env)
        shell: bash -l {0}
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Run downloader and config-path tests
        shell: bash -l {0}
        run: |
          pytest -ra --maxfail=1 --tb=short tests/test_downloader{ArgoTools,GLODAP,IOOSGliders,OleanderXBT,SprayGliders,Saildrones}.py tests/test_config_paths.py

  tests-conda-converter:
